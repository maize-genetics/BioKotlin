# Configuration for the BioKotlin website (https://www.biokotlin.org/).
#
# The site is built with Zensical and published to GitHub Pages by
# .github/workflows/docs.yml. See website/README.md to build it locally.

[project]
site_name = "BioKotlin"
site_url = "https://www.biokotlin.org/"
site_description = "BioKotlin is a high-performance bioinformatics library that brings the power and speed of compiled languages to scripting and big data environments."
site_author = "Lab for Plant Genomic Diversity & Design"

copyright = '<a href="https://www.maizegenetics.net/"><span class="md-copyright__year">&copy; 2026</span> Lab for Plant Genomic Diversity &amp; Design</a>'

repo_url = "https://github.com/maize-genetics/biokotlin"
repo_name = "maize-genetics/biokotlin"
edit_uri = "edit/master/docs/"

docs_dir = "docs"
site_dir = "build/site"

# Pages under tutorials/ other than index.md are generated from the notebooks
# by website/convert_notebooks.py and are not checked in. Zensical skips nav
# entries whose source file is missing, so the site still builds without them.
nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Tutorials" = [
    "tutorials/index.md",
    { "Basic sequence" = "tutorials/basic-sequence.md" },
    { "Sequence operations" = "tutorials/sequence-operations.md" },
    { "Nucleotides & residues" = "tutorials/nucleotides-and-residues.md" },
    { "Amino acids & proteins" = "tutorials/amino-acids-and-proteins.md" },
    { "Sequence IO" = "tutorials/sequence-io.md" },
    { "Genomic ranges" = "tutorials/genomic-ranges.md" },
    { "Feature tree (GFF)" = "tutorials/feature-tree.md" },
    { "Genomic features" = "tutorials/genomic-features.md" },
    { "MAF processing" = "tutorials/maf-processing.md" },
  ] },
  { "Reference" = [
    "reference/index.md",
    { "API reference" = "api-reference.md" },
    { "BioPython to BioKotlin" = "biopython.md" },
    { "Benchmarks" = "benchmarks.md" },
  ] },
  { "About" = [
    { "Contributors" = "contributors.md" },
    { "Contributing" = "contributing.md" },
    { "Data structures" = "design/data-structures.md" },
    { "Terms" = "design/terms.md" },
  ] },
]

extra_css = ["stylesheets/extra.css"]

# Kotlin Playground turns snippets marked `{.runnable}` into editors with a Run
# button. It needs a compiler server that has BioKotlin on its classpath -- see
# extra.playground_server below and website/README.md.
extra_javascript = [
  "https://unpkg.com/kotlin-playground@1.34.0/dist/playground.min.js",
  "javascripts/playground.js",
  "javascripts/logo-morph.js",
]

[project.theme]
custom_dir = "overrides"
language = "en"
logo = "assets/biokotlin_minimal.svg"
favicon = "assets/biokotlin_minimal.svg"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

[project.extra]
# Base URL of a Kotlin compiler server that has BioKotlin on its classpath.
# While this is empty, `{.runnable}` snippets render as ordinary highlighted
# code. Set it to enable the in-page Run button; see website/README.md.
playground_server = ""

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/maize-genetics/BioKotlin"
name = "BioKotlin on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/java"
link = "https://central.sonatype.com/artifact/org.biokotlin/biokotlin"
name = "BioKotlin on Maven Central"
